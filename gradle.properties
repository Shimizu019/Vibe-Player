org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 enables built-in Kotlin and the new DSL by default. This project applies
# org.jetbrains.kotlin.android from the version catalog so the Kotlin version stays
# pinned at libs.versions.toml (kotlin = 2.4.21); both AGP 9 flags are opted out
# because the kotlin-android plugin is not compatible with the new DSL. See
# docs/ASSUMPTIONS.md.
android.builtInKotlin=false
android.newDsl=false
